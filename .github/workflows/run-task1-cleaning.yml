name: Run SWYNEX Task 1 data cleaning

on:
  push:
    paths:
      - "Task-1-Data-Cleaning/RUN_CLEANING.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: Task-1-Data-Cleaning
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download official UCI dataset and clean it
        working-directory: Task-1-Data-Cleaning
        run: python src/clean_data.py
      - name: Commit generated raw data, cleaned data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Task-1-Data-Cleaning/data/raw/adult_raw.csv Task-1-Data-Cleaning/data/processed/adult_cleaned.csv Task-1-Data-Cleaning/reports/data_quality_report.json
          git commit -m "Add generated Task 1 cleaned dataset and quality report" || echo "No generated changes to commit"
          git pull --rebase origin main
          git push

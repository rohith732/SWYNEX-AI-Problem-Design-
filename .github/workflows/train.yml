name: Train SMS Spam Classifier

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Train and evaluate on the UCI dataset
        run: python src/train.py --no-interactive

      - name: Commit measured evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/evaluation.md
          if git diff --cached --quiet; then
            echo "Evaluation report has no changes."
          else
            git commit -m "Add measured SMS spam model evaluation"
            git pull --rebase origin main
            git push
          fi
